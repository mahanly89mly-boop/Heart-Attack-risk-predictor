version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_EXPERIMENT_NAME=heart-disease-risk-serving
      - ENABLE_MLFLOW_LOGGING=true
      - LOG_DB_PATH=/srv/data/monitoring.db
    volumes:
      - ./data:/srv/data
    depends_on:
      - mlflow

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - ./mlflow-data:/mlflow
